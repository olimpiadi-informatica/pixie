[package]
edition = "2024"
name = "pixie-client"
version = "0.1.0"

[lib]
name = "pixie_client"
path = "src/lib.rs"

[[bin]]
name = "pixie-client"
path = "src/main.rs"
test = false
bench = false

[features]
coverage = ["dep:minicov"]

[dependencies]
blake3 = { version = "1.8.3", default-features = false, features = ["prefer_intrinsics", "no_avx512", "pure"] }
futures = { version = "0.3.32", default-features = false, features = ["alloc", "async-await"] }
log = "0.4.29"
lz4_flex = { version = "0.12.1", default-features = false }
minicov = { version = "0.3.8", optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
thingbuf = { version = "0.1.6", default-features = false, features = ["alloc"] }
uefi = { version = "0.36.1", features = ["alloc"] }

[dependencies.pixie-kernel]
path = "../pixie-kernel"

[dependencies.pixie-shared]
path = "../pixie-shared"

[profile.dev]
opt-level = 2

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
