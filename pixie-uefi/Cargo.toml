[package]
edition = "2024"
name = "pixie-uefi"
version = "0.1.0"

[[bin]]
name = "pixie-uefi"
path = "src/main.rs"
test = false
bench = false

[features]
coverage = ["dep:minicov"]

[dependencies]
anstyle = { version = "1.0.13", default-features = false }
blake3 = { version = "1.8.3", default-features = false, features = ["prefer_intrinsics", "no_avx512", "pure"] }
dhcparse = { version = "1.0.0", default-features = false }
etherparse = { version = "0.21.0", default-features = false }
futures = { version = "0.3.32", default-features = false, features = ["alloc", "async-await"] }
gpt_disk_io = "0.16.2"
log = { version = "0.4.29", features = ["release_max_level_info"] }
lz4_flex = { version = "0.12.1", default-features = false }
minicov = { version = "0.3.8", optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
spin = "0.10.0"
thingbuf = { version = "0.1.6", default-features = false, features = ["alloc"] }
uefi = { version = "0.36.1", features = ["alloc", "global_allocator", "panic_handler"] }

[dependencies.pixie-shared]
path = "../pixie-shared"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
