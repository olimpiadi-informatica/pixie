[package]
edition = "2024"
name = "pixie-kernel"
version = "0.1.0"

[dependencies]
dhcparse = { version = "1.0.0", default-features = false }
etherparse = { version = "0.21.0", default-features = false }
futures = { version = "0.3.32", default-features = false, features = ["alloc", "async-await"] }
gpt_disk_io = "0.16.2"
log = { version = "0.4.29", features = ["release_max_level_info"] }
lz4_flex = { version = "0.12.1", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
spin = "0.10.0"
talc = { version = "4.4.3", default-features = false, features = ["lock_api"] }
uefi = { version = "0.36.1", features = ["alloc"] }

[dependencies.pixie-drivers]
path = "../pixie-drivers"

[dependencies.pixie-shared]
path = "../pixie-shared"
