[package]
edition = "2024"
name = "pixie-kernel"
version = "0.1.0"

[dependencies]
anstyle = { version = "1.0.13", default-features = false }
core_detect = "1.0.0"
futures = { version = "0.3.32", default-features = false, features = ["alloc", "async-await"] }
gpt_disk_io = "0.16.2"
log = "0.4.29"
lz4_flex = { version = "0.12.1", default-features = false }
managed = { version = "0.8.0", default-features = false, features = ["alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
smoltcp = { version = "0.12.0", default-features = false, features = ["alloc", "proto-ipv4", "medium-ethernet", "socket-udp", "socket-tcp", "socket-dhcpv4", "async", "socket-tcp-cubic"] }
spin = "0.10.0"
talc = { version = "4.4.3", default-features = false, features = ["lock_api"] }
thingbuf = { version = "0.1.6", default-features = false, features = ["alloc"] }
uefi = { version = "0.36.1", features = ["alloc"] }
uefi-raw = "0.13.0"

[dependencies.pixie-drivers]
path = "../pixie-drivers"

[dependencies.pixie-shared]
path = "../pixie-shared"
