name: Rust

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  clippy:
    name: Cargo Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          target: wasm32-unknown-unknown, x86_64-unknown-uefi
          cache-workspaces: |
            pixie-client
            pixie-drivers
            pixie-kernel
            pixie-server
            pixie-shared
            pixie-web

      - name: cargo clippy
        run: |
          for t in pixie-*; do
            pushd $t
            cargo fmt --check
            cargo clippy -- -D warnings
            popd
          done
          cargo clippy --manifest-path pixie-shared/Cargo.toml --all-features --all-targets -- -D warnings
          cargo clippy --manifest-path pixie-drivers/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path pixie-client/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
          cargo test --manifest-path pixie-shared/Cargo.toml --all-features
          cargo test --manifest-path pixie-server/Cargo.toml
          cargo test --manifest-path pixie-drivers/Cargo.toml
          cargo test --manifest-path pixie-client/Cargo.toml --target x86_64-unknown-linux-gnu

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-05-23
          components: llvm-tools
          target: wasm32-unknown-unknown, x86_64-unknown-uefi
          cache-workspaces: |
            pixie-client
            pixie-drivers
            pixie-kernel
            pixie-server
            pixie-shared
            pixie-web

      - name: Install rustfilt
        run: cargo install rustfilt

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0

      - name: Run flash codec benchmark (pixie-shared)
        working-directory: pixie-shared
        run: cargo bench --features std -- --output-format bencher | tee ../flash-codec-bench.txt

      - name: Track flash codec benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "cargo"
          name: "Flash codec micro-benchmark (chunk_codec)"
          output-file-path: flash-codec-bench.txt
          gh-pages-branch: benchmark-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "200%"
          fail-on-alert: false
          summary-always: true

      - name: Run test
        env:
          BENCH_JSON: ${{ github.workspace }}/qemu-bench.json
        run: setsid ./test.sh

      - name: Track e2e store/flash benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "customSmallerIsBetter"
          name: "Store/Flash E2E (qemu)"
          output-file-path: qemu-bench.json
          gh-pages-branch: benchmark-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          skip-fetch-gh-pages: true
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "200%"
          fail-on-alert: false
          summary-always: true
